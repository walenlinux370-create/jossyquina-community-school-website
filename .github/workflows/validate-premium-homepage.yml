name: Validate premium homepage

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "lib/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "next.config.mjs"
      - ".github/workflows/validate-premium-homepage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install dependencies and build Next.js
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://jossyquina.co.mz
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
